name: CI
on: push

jobs:
  UnitTests:
    name: Unit Test Build Action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: U1 Unit Tests
        run: mvn -Dtest=com.napier.gp.U1UnitTest test
      - name: U2 Unit Tests
        run: mvn -Dtest=com.napier.gp.U2UnitTest test
      - name: U1 Unit Tests
        run: mvn -Dtest=com.napier.gp.U3UnitTest test
      - name: Populate World Unit Test
        run: mvn -Dtest=com.napier.gp.PopWorldUnitTest test
      - name: City Class Unit Test
        run: mvn -Dtest=com.napier.gp.CityUnitTest test
      - name: Country Class Unit Test
        run: mvn -Dtest=com.napier.gp.CountryUnitTest test
      - name: CountryLanguage Class Unit Test
        run: mvn -Dtest=com.napier.gp.CountryLanguageUnitTest test
      - name: World Class Unit Test
        run: mvn -Dtest=com.napier.gp.WorldUnitTest test
      - name: List dirs
        run: |
          cd ./target/site/jacoco
          pwd
          ls
      - name: CodeCov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
#          directory: ./target/site/jacoco
#          verbose: true # optional (default = false)
  IntegrationTests:
    name: Integration Test Build Action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Populate World Integration Tests
        run: |
          docker build -t database ./db 
          docker run --name world -dp 33060:3306 database
          mvn -Dtest=com.napier.gp.PopWorldIntegrationTest test
          docker stop world
          docker rm world
          docker image rm database
      - name: DB Integration Tests
        run: |
          docker build -t database ./db 
          docker run --name world -dp 33060:3306 database
          mvn -Dtest=com.napier.gp.DBIntegrationIT test
          docker stop world
          docker rm world
          docker image rm database
      - name: CodeCov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  build:
    name: Build and Start using docker-compose
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Build with Maven
        run: mvn package
      - name: Run docker compose
        run: docker compose up --abort-on-container-exit


